<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sistemas Embarcados — micro:bit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --board:#05130f;
  --board-2:#0a1f18;
  --copper:#e0a458;
  --copper-dim:#8a5f2b;
  --led:#ff3b2f;
  --led-dim:#4a1310;
  --teal:#3ddbb0;
  --silk:#eef4f1;
  --muted:rgba(238,244,241,.62);
  --line:rgba(224,164,88,.22);
  --display:"Space Grotesk","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Consolas,monospace;
  --ease:cubic-bezier(.16,.84,.24,1);
}

html,body{height:100%;width:100%;overflow:hidden;background:var(--board);color:var(--silk);
  font-family:var(--body);-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

/* =========================================================
   PALCO
========================================================= */
.stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;perspective:1500px;
  background:radial-gradient(ellipse at 78% 12%,rgba(61,219,176,.10),transparent 46%),
             radial-gradient(ellipse at 12% 88%,rgba(224,164,88,.09),transparent 44%),
             var(--board)}

/* trilhas de cobre no fundo, com deriva lenta */
.traces{position:fixed;inset:-10%;z-index:0;opacity:.5;pointer-events:none;
  background-image:
    linear-gradient(rgba(224,164,88,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(224,164,88,.07) 1px,transparent 1px),
    linear-gradient(45deg,rgba(61,219,176,.05) 1px,transparent 1px);
  background-size:64px 64px,64px 64px,90px 90px;
  animation:drift 60s linear infinite}
@keyframes drift{to{transform:translate3d(-64px,-64px,0)}}

.vignette{position:fixed;inset:0;z-index:60;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 44%,rgba(0,8,5,.82) 100%)}
.scan{position:fixed;inset:0;z-index:59;pointer-events:none;opacity:.28;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}

/* =========================================================
   SLIDES
========================================================= */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  transform:translateZ(-140px) rotateY(4deg);
  transition:opacity .55s var(--ease),transform .85s var(--ease),visibility .55s,filter .6s var(--ease);
  will-change:transform,opacity}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;z-index:3}
.slide.leaving{opacity:0;visibility:visible;z-index:2;
  transform:translateZ(-260px) translateX(var(--out,-5%)) rotateY(var(--rot,-7deg));filter:blur(7px)}

.inner{position:relative;z-index:4;height:100%;width:min(1280px,100%);margin-inline:auto;
  padding:clamp(56px,7vh,84px) clamp(22px,5vw,60px) clamp(96px,12vh,110px);
  display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(20px,4vw,52px)}
.inner.solo{grid-template-columns:1fr;place-items:center;text-align:center}

/* ---- tipografia ---- */
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin-bottom:12px;
  font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;color:var(--copper)}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--copper)}

h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;line-height:1.02;font-weight:700}
h2{font-size:clamp(1.75rem,3.6vw,2.9rem);text-wrap:balance}
.rule{width:60px;height:3px;margin:18px 0;border-radius:2px;
  background:linear-gradient(90deg,var(--copper),var(--teal))}

.lede{max-width:50ch;color:var(--muted);font-size:clamp(.95rem,1.25vw,1.06rem);line-height:1.7}
.lede+.lede{margin-top:11px}
.lede b{color:var(--silk);font-weight:600}
.lede code{font-family:var(--mono);font-size:.9em;color:var(--teal)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:6px;background:rgba(224,164,88,.05);
  font-family:var(--mono);font-size:.74rem;color:rgba(238,244,241,.8)}
.chip b{color:var(--copper);font-weight:500}

.note{max-width:48ch;margin-top:20px;padding:13px 16px;border-left:3px solid var(--teal);
  background:linear-gradient(90deg,rgba(61,219,176,.09),transparent);border-radius:0 8px 8px 0;
  font-size:.9rem;line-height:1.6;color:rgba(238,244,241,.78)}
.note b{color:var(--teal)}

/* ---- coluna da figura ---- */
.fig{position:relative;justify-self:center;width:100%;max-width:560px;padding:20px;
  border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(10,31,24,.9),rgba(5,19,15,.75));
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.02)}
.fig::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:radial-gradient(circle at 20% 0%,rgba(61,219,176,.1),transparent 55%)}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig figcaption{margin-top:14px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:rgba(238,244,241,.42);text-align:center}
.slide.active .fig{animation:figIn .8s var(--ease) .1s both}
@keyframes figIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

/* cartões de comparação / grade */
.cards{display:grid;gap:12px;width:100%}
.cards.two{grid-template-columns:1fr 1fr}
.cards.four{grid-template-columns:1fr 1fr}
.kard{padding:16px 17px;border:1px solid var(--line);border-radius:12px;background:rgba(10,31,24,.55)}
.kard h4{font-family:var(--display);font-size:1rem;font-weight:600;margin-bottom:7px;color:var(--silk)}
.kard p{font-size:.85rem;line-height:1.55;color:var(--muted)}
.kard .tag{display:inline-block;margin-bottom:9px;padding:3px 9px;border-radius:5px;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.08em}
.kard.a .tag{background:rgba(255,59,47,.14);color:var(--led)}
.kard.b .tag{background:rgba(61,219,176,.13);color:var(--teal)}
.kard .ic{width:30px;height:30px;margin-bottom:10px;color:var(--copper)}

/* código */
pre.code{width:100%;padding:18px;border:1px solid var(--line);border-radius:12px;
  background:rgba(2,10,8,.85);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5)}
pre.code code{font-family:var(--mono);font-size:clamp(.72rem,1.05vw,.86rem);line-height:1.85;color:#d7e4de;white-space:pre}
.k{color:#ff8a7a}.f{color:var(--teal)}.s{color:var(--copper)}.c{color:#5d7a70;font-style:italic}.n{color:#c9a6ff}

/* entradas escalonadas */
.slide.active .up{animation:up .7s var(--ease) both}
.slide.active .d1{animation-delay:.05s}.slide.active .d2{animation-delay:.12s}
.slide.active .d3{animation-delay:.19s}.slide.active .d4{animation-delay:.26s}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* =========================================================
   CAPA E DIVISORES
========================================================= */
.cover .inner{grid-template-columns:1fr 1fr}
.cover h1{font-size:clamp(2.3rem,6.4vw,4.6rem);line-height:.98;letter-spacing:-.04em}
.cover h1 em{font-style:normal;color:var(--copper)}
.cover .sub{margin-top:20px;font-family:var(--mono);font-size:clamp(.72rem,1.4vw,.9rem);
  letter-spacing:.22em;color:var(--teal)}
.cover .byline{margin-top:10px;font-size:.82rem;color:rgba(238,244,241,.42)}

.act .inner{grid-template-columns:1fr}
.act .num{display:inline-block;margin-bottom:18px;padding:7px 18px;border:1px solid var(--line);border-radius:999px;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.26em;color:var(--copper);background:rgba(224,164,88,.06)}
.act h2{font-size:clamp(2.1rem,6.5vw,4.6rem);line-height:.96}
.act .lede{margin-inline:auto;text-align:center;max-width:48ch}
.act .rule{margin:20px auto}
.act::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(255,59,47,.10),transparent 55%)}

/* =========================================================
   TRANSIÇÃO: PULSO DE SINAL
========================================================= */
.pulse{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;display:grid;place-items:center}
.pulse svg{width:min(140vw,140vh);height:auto;fill:none;stroke:var(--teal);stroke-width:1;
  filter:drop-shadow(0 0 10px rgba(61,219,176,.8))}
.pulse.fire{animation:pulseGo .55s var(--ease)}
@keyframes pulseGo{0%{opacity:0;transform:scale(.7)}22%{opacity:.85}100%{opacity:0;transform:scale(1.35)}}
.sweep{position:fixed;inset:0;z-index:56;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 45%,rgba(61,219,176,.5) 50%,transparent 55%)}
.sweep.fire{animation:sweepGo .45s ease-out}
@keyframes sweepGo{0%{opacity:0;transform:translateX(-60%)}35%{opacity:.6}100%{opacity:0;transform:translateX(60%)}}

/* =========================================================
   HUD
========================================================= */
.hud{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:5px;
  padding:6px;border-radius:12px;background:rgba(4,14,11,.85);border:1px solid var(--line);
  backdrop-filter:blur(16px);box-shadow:0 16px 50px rgba(0,0,0,.6)}
.hud button{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;
  border:1px solid transparent;transition:.22s var(--ease)}
.hud button:hover{background:rgba(224,164,88,.16);border-color:var(--line);transform:translateY(-2px)}
.hud button[aria-pressed="true"]{background:rgba(61,219,176,.16);border-color:rgba(61,219,176,.4);color:var(--teal)}
.hud svg{width:16px;height:16px;fill:currentColor}
.count{min-width:70px;text-align:center;font-family:var(--mono);font-size:.78rem;color:rgba(238,244,241,.4)}
.count b{color:var(--copper);font-weight:500}

.dots{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:70;display:flex;gap:5px;
  max-width:76vw;flex-wrap:wrap;justify-content:center}
.dots button{width:6px;height:6px;border-radius:2px;background:rgba(238,244,241,.18);transition:.25s var(--ease)}
.dots button:hover{background:var(--copper)}
.dots button[aria-current="true"]{width:22px;background:var(--teal);box-shadow:0 0 10px rgba(61,219,176,.7)}

.progress{position:fixed;left:0;bottom:0;height:2px;width:0;z-index:90;
  background:linear-gradient(90deg,var(--copper),var(--teal));box-shadow:0 0 14px rgba(61,219,176,.6);
  transition:width .45s var(--ease)}

.chapter{position:fixed;top:24px;left:clamp(18px,4vw,40px);z-index:70;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;color:rgba(238,244,241,.35)}
.slide-no{position:fixed;top:20px;right:clamp(18px,4vw,40px);z-index:70;
  font-family:var(--mono);font-size:.85rem;color:rgba(238,244,241,.25)}
.slide-no b{color:var(--copper)}
.hint{position:fixed;bottom:20px;right:clamp(18px,4vw,40px);z-index:70;font-family:var(--mono);font-size:.66rem;color:rgba(238,244,241,.25)}
.hint kbd{padding:2px 5px;border:1px solid var(--line);border-radius:4px}

/* =========================================================
   ABERTURA (boot)
========================================================= */
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 45%,#0b241c,#02100c 72%)}
.gate h1{font-size:clamp(1.9rem,6vw,3.6rem);line-height:1.05}
.gate h1 em{font-style:normal;color:var(--copper)}
.gate p{margin:14px 0 28px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.play{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:10px;
  border:1px solid rgba(61,219,176,.45);background:rgba(61,219,176,.12);
  font-family:var(--display);font-weight:600;font-size:.98rem;transition:.25s var(--ease)}
.play:hover{background:rgba(61,219,176,.24);transform:translateY(-2px)}
.play svg{width:15px;height:15px;fill:var(--teal)}
.gate.off{opacity:0;pointer-events:none;transition:opacity .45s ease}

.boot{position:fixed;inset:0;z-index:190;display:none;place-items:center;background:#02100c}
.boot.run{display:grid}
.boot .wrap{text-align:center}
.boot .matrix{display:grid;grid-template-columns:repeat(5,18px);gap:8px;justify-content:center;margin-bottom:26px}
.boot .matrix i{width:18px;height:18px;border-radius:3px;background:var(--led-dim);transition:.12s linear}
.boot .matrix i.on{background:var(--led);box-shadow:0 0 14px rgba(255,59,47,.9),0 0 30px rgba(255,59,47,.4)}
.boot .log{font-family:var(--mono);font-size:.78rem;color:var(--teal);min-height:1.4em;letter-spacing:.06em}
.boot .ttl{margin-top:18px;font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,5vw,3rem);
  opacity:0;letter-spacing:-.03em}
.boot.reveal .ttl{animation:up .7s var(--ease) forwards}
.boot .curtain{position:absolute;inset:0;background:#02100c;opacity:0}
.boot.done .curtain{animation:fadeIn .5s ease-out forwards}
@keyframes fadeIn{to{opacity:1}}

/* =========================================================
   RESPONSIVO
========================================================= */
@media (max-width:960px){
  .inner,.cover .inner{grid-template-columns:1fr;align-content:center;gap:18px;padding-top:66px}
  .fig{order:-1;max-width:min(88%,430px);padding:14px}
  .lede{max-width:100%;font-size:.92rem}
  .cards.two,.cards.four{grid-template-columns:1fr}
  .dots,.hint{display:none}
}
@media (max-width:560px){
  .inner{padding:60px 18px 92px}
  h2{font-size:1.55rem}
  .cover h1{font-size:2.1rem}
  .fig{max-width:100%}
  .chip{font-size:.68rem;padding:5px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.1s!important}
  .traces{animation:none}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div>
    <h1>Sistemas <em>Embarcados</em></h1>
    <p>com micro:bit · a apresentação tem som</p>
    <button class="play" id="startBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Ligar a placa
    </button>
  </div>
</div>

<div class="boot" id="boot">
  <div class="wrap">
    <div class="matrix" id="bootMatrix"></div>
    <div class="log" id="bootLog"></div>
    <div class="ttl">Sistemas Embarcados</div>
  </div>
  <div class="curtain"></div>
</div>

<div class="traces"></div>
<main class="stage" id="stage" aria-label="Apresentação sobre sistemas embarcados"></main>

<div class="pulse" id="pulse">
  <svg viewBox="0 0 400 400" aria-hidden="true">
    <circle cx="200" cy="200" r="90"/><circle cx="200" cy="200" r="140" opacity=".6"/>
    <circle cx="200" cy="200" r="190" opacity=".3"/>
    <path d="M10 200h80l14-26 20 52 16-26h100l14-26 20 52 16-26h100" stroke-width="1.4"/>
  </svg>
</div>
<div class="sweep" id="sweep"></div>

<div class="scan"></div>
<div class="vignette"></div>

<div class="chapter" id="chapter"></div>
<div class="slide-no"><b id="cur">1</b> / <span id="tot">1</span></div>
<div class="dots" id="dots"></div>

<nav class="hud" aria-label="Controles">
  <button id="prev" title="Anterior (←)"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg></button>
  <div class="count"><b id="cur2">1</b> / <span id="tot2">1</span></div>
  <button id="next" title="Próximo (→)"><svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
  <button id="auto" title="Automático (P)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <button id="mute" title="Som (M)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
  <button id="full" title="Tela cheia (F)"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
</nav>

<div class="progress" id="bar"></div>
<div class="hint"><kbd>←</kbd> <kbd>→</kbd> navegar · <kbd>F</kbd> tela cheia · <kbd>M</kbd> som</div>

<script>
/* =================================================================
   FIGURAS — todas desenhadas em SVG, nada externo
================================================================= */
const F = {};

/* placa micro:bit ------------------------------------------------ */
F.board = (callouts) => {
  let leds = '';
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){
    const on = [[0,1],[0,3],[1,0],[1,2],[1,4],[2,0],[2,4],[3,1],[3,3],[4,2]]
      .some(p=>p[0]===r&&p[1]===c);
    leds += '<rect x="'+(148+c*17)+'" y="'+(58+r*17)+'" width="9" height="12" rx="2" fill="'+(on?'#ff3b2f':'#3a1512')+'">'
      + (on?'<animate attributeName="opacity" values="1;.45;1" dur="2.4s" begin="'+(r*0.12+c*0.07)+'s" repeatCount="indefinite"/>':'')
      + '</rect>';
  }
  let pins = '';
  const rings = [[70,'0'],[130,'1'],[190,'2'],[250,'3V'],[310,'GND']];
  rings.forEach(([x,l])=>{
    pins += '<path d="M'+x+' 196 h44 v34 h-44 z" fill="#d9a047"/>'
         + '<circle cx="'+(x+22)+'" cy="216" r="11" fill="#0a1f18"/>'
         + '<text x="'+(x+22)+'" y="248" text-anchor="middle" font-size="11" fill="#7f9a8f" font-family="monospace">'+l+'</text>';
  });
  for(let i=0;i<20;i++){
    const x = 62 + i*17.4;
    if(x>60 && x<356) pins += '<rect x="'+x+'" y="196" width="6" height="18" fill="#b07f38" opacity=".85"/>';
  }
  return '<svg viewBox="0 0 420 270" role="img" aria-label="Placa micro:bit">'
  + '<defs><linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">'
  + '<stop offset="0" stop-color="#0f3a2c"/><stop offset="1" stop-color="#0a2a20"/></linearGradient></defs>'
  + '<path d="M40 18 h340 a14 14 0 0 1 14 14 v150 h-30 v34 h-58 v-34 h-52 v34 h-58 v-34 h-52 v34 h-58 v-34 H26 V32 a14 14 0 0 1 14-14 z" fill="url(#pcb)" stroke="#1d5c47" stroke-width="2"/>'
  /* trilhas */
  + '<g stroke="#c9903f" stroke-width="1.2" fill="none" opacity=".5">'
  + '<path d="M60 40 h60 l16 16 h40"/><path d="M60 60 h40 l14 14 v50"/>'
  + '<path d="M360 40 h-50 l-14 14 h-30"/><path d="M300 150 h60 v-40"/>'
  + '<path d="M90 170 h70 v-20"/><path d="M250 170 h80"/></g>'
  /* matriz de LEDs */
  + '<rect x="140" y="50" width="98" height="98" rx="6" fill="#08110d" stroke="#1d5c47"/>' + leds
  /* botões A e B */
  + '<g><circle cx="88" cy="100" r="21" fill="#14332a" stroke="#2b6b55" stroke-width="2"/>'
  + '<circle cx="88" cy="100" r="11" fill="#0b1f19"/>'
  + '<text x="88" y="140" text-anchor="middle" font-size="13" fill="#eef4f1" font-family="monospace">A</text></g>'
  + '<g><circle cx="330" cy="100" r="21" fill="#14332a" stroke="#2b6b55" stroke-width="2"/>'
  + '<circle cx="330" cy="100" r="11" fill="#0b1f19"/>'
  + '<text x="330" y="140" text-anchor="middle" font-size="13" fill="#eef4f1" font-family="monospace">B</text></g>'
  /* logo touch + USB + antena */
  + '<path d="M196 26 l14 12 -14 12 -14-12 z" fill="#d9a047" opacity=".9"><animate attributeName="opacity" values=".9;.35;.9" dur="3s" repeatCount="indefinite"/></path>'
  + '<rect x="176" y="12" width="42" height="12" rx="3" fill="#8d9aa2"/>'
  + '<g stroke="#3ddbb0" stroke-width="1.6" fill="none" opacity=".85">'
  + '<path d="M330 30 q14 -10 28 0"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></path>'
